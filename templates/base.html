<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Company</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background-color: #111;
        }

        /* NAVBAR */

        nav{
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            text-align: center;
            z-index: 1000;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        nav a:hover{
            color: lightblue;
        }

        /* MAIN CONTENT */

        .content{
            padding-top: 80px;
        }

        h1{
            color: white;
            text-align: center;
            margin: 20px;
        }

        p{
            color: white;
            text-align: center;
            margin: 20px;
            font-size: 20px;
        }

        ul{
            color: white;
            width: 50%;
            margin: auto;
            font-size: 20px;
        }

        img{
            width: 100%;
            display: block;
        }

        form{
            width:50%;
            margin:auto;
            text-align:center;
        }

        input,
        textarea{
            width:100%;
            padding:15px;
            font-size:18px;
        }
        
        button{
            padding:15px 30px;
            font-size:18px;
            cursor:pointer;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            color: white;
        }

        th, td {
            border: 1px solid white;
            padding: 15px;
        }

        th {
            background-color: #1e90ff;
        }

        tr:nth-child(even) {
            background-color: #222;
        }

        /* RESPONSIVENESS */

        @media (max-width:768px){

            nav{
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a{
                margin: 10px;
                font-size: 14px;
            }

        }

    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->

    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/services">Services</a>
        <a href="/portfolio">Portfolio</a>
        <a href="/team">Team</a>
        <a href="/contact">Contact</a>
        <a href="/login">Login</a>
        <a href="/logout">Logout</a>
        <a href="/register">Register</a>
    </nav>

    <!-- PAGE CONTENT -->

    <div class="content">

        {% block content %}

        {% endblock %}

    </div>

</body>
</html>
