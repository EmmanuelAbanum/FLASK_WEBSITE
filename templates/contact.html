{% extends "base.html" %}

{% block content %}

<h1>Contact Us</h1>

<img src="{{ url_for('static',
filename='images/contact.png') }}">

<form method="POST">

    <input type="text"
           name="name"
           placeholder="Enter your name"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Enter your email"
           required>

    <br><br>

    <textarea name="message"
              placeholder="Your message"
              rows="8"
              cols="50"
              required>
    </textarea>

    <br><br>

    <button type="submit">Send Message</button>

</form>

{% endblock %}
